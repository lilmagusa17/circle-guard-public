apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: auth-service
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: auth-service
  namespaceSelector:
    matchNames:
      - circleguard-dev
      - circleguard-stage
      - circleguard-production
  endpoints:
    - targetPort: 8180
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
---
