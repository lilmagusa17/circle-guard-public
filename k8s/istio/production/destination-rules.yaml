# Circuit breaker DestinationRules for all 8 CircleGuard services in circleguard-dev.
# gateway-service has v1/v2 subsets for canary. All others have a single v1 subset.
# outlierDetection ejects hosts after 5 consecutive 5xx in a 30s interval.
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: auth-service
  namespace: circleguard-production
spec:
  host: auth-service
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        h2UpgradePolicy: DO_NOT_UPGRADE
        http1MaxPendingRequests: 100
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 100
  subsets:
    - name: v1
      labels:
        version: v1
---
