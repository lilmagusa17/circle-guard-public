---
# gateway-service VirtualService: mesh traffic + external ingress traffic.
# Canary: change weights (v1: 90, v2: 10) to activate canary deployment.
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: gateway-service
  namespace: circleguard-production
spec:
  hosts:
    - gateway-service
  gateways:
    - istio-system/circleguard-gateway
    - mesh
  http:
    - retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,gateway-error,connect-failure,retriable-4xx
      route:
        - destination:
            host: gateway-service
            subset: v1
          weight: 100
        - destination:
            host: gateway-service
            subset: v2
          weight: 0
