# VirtualServices for all 8 CircleGuard services in circleguard-dev.
# Retry policy: 3 attempts on 5xx/gateway-error/connect-failure, 2s per-try timeout.
# gateway-service routes 100% to v1 (canary inactive). Adjust weights to activate canary.
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: auth-service
  namespace: circleguard-production
spec:
  hosts:
    - auth-service
  http:
    - retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,gateway-error,connect-failure,retriable-4xx
      route:
        - destination:
            host: auth-service
            subset: v1
---
