# Istio AuthorizationPolicy for circleguard-stage namespace
# Strategy: default-deny all traffic, then explicit allow per service-to-service edge

# Default deny-all: any request not matched by an ALLOW policy is denied
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: deny-all
  namespace: circleguard-stage
spec: {}
---
# Allow gateway-service to reach all other services in the namespace
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-from-gateway
  namespace: circleguard-stage
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/circleguard-stage/sa/gateway-service-sa"]
---
# Allow auth-service to be called by any service in the namespace (JWT validation)
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-auth-service
  namespace: circleguard-stage
spec:
  selector:
    matchLabels:
      app: auth-service
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["circleguard-stage"]
---
# Allow all intra-namespace and istio-system traffic (covers Kafka consumers,
# dashboard-service querying promotion-service, etc.)
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-internal
  namespace: circleguard-stage
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["circleguard-stage", "istio-system"]
---
# Allow Prometheus scraping from monitoring namespace
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: circleguard-stage
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["monitoring"]
      to:
        - operation:
            paths: ["/actuator/prometheus", "/actuator/health"]
