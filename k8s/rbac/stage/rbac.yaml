# RBAC manifests for circleguard-stage namespace
# One ServiceAccount + Role + RoleBinding per microservice
# Each service account gets least-privilege access: read-only on configmaps and secrets

# ──────────────────────────────────────────────
# auth-service
# ──────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service-sa
  namespace: circleguard-stage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auth-service-role
  namespace: circleguard-stage
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auth-service-binding
  namespace: circleguard-stage
subjects:
  - kind: ServiceAccount
    name: auth-service-sa
    namespace: circleguard-stage
roleRef:
  kind: Role
  name: auth-service-role
  apiGroup: rbac.authorization.k8s.io
---
