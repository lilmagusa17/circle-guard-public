apiVersion: apps/v1
kind: Deployment
metadata:
  name: form-service
  namespace: circleguard-production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: form-service
  template:
    metadata:
      labels:
        app: form-service
        version: v1
    spec:
      containers:
        - name: form-service
          image: magusa17/circleguard-form:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8086
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/circleguard_form
            - name: SPRING_DATASOURCE_USERNAME
              value: admin
            - name: SPRING_DATASOURCE_PASSWORD
              value: circleguard
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8086
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8086
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: form-service
  namespace: circleguard-production
spec:
  selector:
    app: form-service
  ports:
    - port: 8086
      targetPort: 8086
